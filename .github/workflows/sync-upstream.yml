name: Sync Fork with Upstream

on:
  schedule:
    - cron: '0 6 1,15,28 * *'  #  1° , 15° e 28° di ogni mese alle 06:00 UTC
  workflow_dispatch:               # bottone manuale disponibile

jobs:
  sync:
    name: Sync anomalyco/opencode → emaxlele/opencode
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name  "emaxlele"
          git config user.email "emaxlele.lavoro@gmail.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/anomalyco/opencode.git

      - name: Fetch upstream
        run: git fetch upstream --tags

      - name: Sync dev branch
        run: |
          git checkout dev
          git merge --no-edit upstream/dev

      - name: Push to fork
        run: git push origin dev --follow-tags

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Sync failed — likely a merge conflict. Resolve manually and re-run."
